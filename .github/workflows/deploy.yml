name: Deploy to Firebase

# Every push to main deploys. Hosting always; functions only when something under
# functions/ actually changed, so a frontend tweak doesn't sit through a 3-5 minute
# backend deploy for no reason.
on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing an empty commit.
  workflow_dispatch:

# One deploy at a time. Two pushes in quick succession would otherwise race each
# other to the same Firebase project; the newer one wins and the older is cancelled.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: ind-lmt

jobs:
  # ---------------------------------------------------------------------------
  # Gate. Nothing deploys until the frontend builds and the functions parse.
  # This is what stops a syntax error in functions/index.js from taking the
  # Zapier intake webhook offline.
  # ---------------------------------------------------------------------------
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      functions-changed: ${{ steps.changes.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need the previous commit to diff against

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Confirm the bundle actually exists
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing after build"; exit 1; }
          echo "Bundle built: $(du -sh dist | cut -f1)"

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Syntax-check Cloud Functions
        run: |
          node --check functions/index.js
          node --check functions/branchRouting.js
          echo "Cloud Functions parse cleanly."

      - name: Verify invariants
        run: node scripts/verify-invariants.mjs

      - name: Test pure helpers
        run: node scripts/test-helpers.mjs

      - name: Guard against a committed service-account key
        run: |
          if git ls-files | grep -Ei '(serviceaccount|service-account|adminsdk).*\.json$'; then
            echo "::error::A service account key looks committed. Remove it and rotate the key."
            exit 1
          fi
          echo "No service account keys tracked."

      - name: Did anything under functions/ change?
        id: changes
        run: |
          if git diff --name-only HEAD^ HEAD 2>/dev/null | grep -q '^functions/'; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
            echo "functions/ changed — backend will deploy."
          else
            echo "functions=false" >> "$GITHUB_OUTPUT"
            echo "functions/ unchanged — skipping the backend deploy."
          fi

      - name: Keep the built bundle for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Deploy. Only runs if verify passed.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore the verified bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install functions dependencies
        if: needs.verify.outputs.functions-changed == 'true'
        run: npm ci --prefix functions

      # The service account JSON lives in the FIREBASE_SERVICE_ACCOUNT_IND_LMT repo secret.
      # Written to a file here because the Firebase CLI authenticates via
      # GOOGLE_APPLICATION_CREDENTIALS pointing at a path, not at raw JSON.
      - name: Authenticate to Firebase
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_IND_LMT }}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_IND_LMT secret is not set. See README, 'Deploy credentials'."
            exit 1
          fi
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IND_LMT }}' > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy hosting
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT" --non-interactive

      - name: Deploy Cloud Functions
        if: needs.verify.outputs.functions-changed == 'true'
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT" --non-interactive

      - name: Remove the credential from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-key.json"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy to \`$FIREBASE_PROJECT\`"
            echo ""
            echo "- Hosting: deployed"
            if [ "${{ needs.verify.outputs.functions-changed }}" = "true" ]; then
              echo "- Functions: deployed"
            else
              echo "- Functions: skipped (no changes under \`functions/\`)"
            fi
            echo ""
            echo "https://lmt.bobcatofindy.com"
          } >> "$GITHUB_STEP_SUMMARY"
